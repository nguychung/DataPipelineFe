<div class="max-w-5xl mx-auto p-8 bg-white rounded-xl shadow-lg mt-10">
  <h2 class="text-3xl font-bold mb-8 text-gray-800 text-center">Data Pipeline Configurator</h2>

  <nz-steps [nzCurrent]="currentStep" class="mb-10">
    <nz-step nzTitle="General Info"></nz-step>
    <nz-step nzTitle="Source Config"></nz-step>
    <nz-step nzTitle="Transformations"></nz-step>
    <nz-step nzTitle="Destination"></nz-step>
  </nz-steps>

  <form nz-form [formGroup]="flowForm" nzLayout="vertical">
    
    <div *ngIf="currentStep === 0" formGroupName="flow_metadata" class="space-y-4">
      <nz-form-item>
        <nz-form-label nzRequired>Flow ID</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="id" />
        </nz-form-control>
      </nz-form-item>
      
      <div class="grid grid-cols-2 gap-4">
        <nz-form-item>
          <nz-form-label nzRequired>Namespace</nz-form-label>
          <nz-form-control><input nz-input formControlName="namespace" /></nz-form-control>
        </nz-form-item>
        <nz-form-item [formGroup]="$any(flowForm.get('trigger'))">
          <nz-form-label nzRequired>Trigger (Cron)</nz-form-label>
          <nz-form-control><input nz-input formControlName="cron" /></nz-form-control>
        </nz-form-item>
      </div>

      <nz-form-item>
        <nz-form-label>Description</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="description" rows="3"></textarea>
        </nz-form-control>
      </nz-form-item>
    </div>

    <div *ngIf="currentStep === 1" formGroupName="source" class="space-y-4">
      <div class="grid grid-cols-3 gap-4">
        <nz-form-item>
          <nz-form-label nzRequired>Type</nz-form-label>
          <nz-form-control><input nz-input formControlName="type" /></nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzRequired>Method</nz-form-label>
          <nz-form-control><input nz-input formControlName="method" /></nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label>Response Extract Path</nz-form-label>
          <nz-form-control><input nz-input formControlName="response_extract_path" /></nz-form-control>
        </nz-form-item>
      </div>

      <nz-form-item>
        <nz-form-label nzRequired>URL</nz-form-label>
        <nz-form-control><input nz-input formControlName="url" /></nz-form-control>
      </nz-form-item>

      <nz-card nzTitle="Headers" nzSize="small">
        <div formArrayName="headers">
          <div *ngFor="let h of sourceHeaders.controls; let i=index" [formGroupName]="i" class="flex gap-4 mb-3">
            <input nz-input formControlName="key" placeholder="Key" class="w-1/3" />
            <input nz-input formControlName="value" placeholder="Value" class="w-1/2" />
            <button nz-button nzType="default" nzDanger (click)="removeHeader(i)">Xóa</button>
          </div>
          <button nz-button nzType="dashed" class="w-full" (click)="addHeader()">+ Thêm Header</button>
        </div>
      </nz-card>

      <nz-card nzTitle="Request Params Mapping" nzSize="small">
        <div formArrayName="request_param_mapping">
          <div *ngFor="let param of requestParams.controls; let i=index" [formGroupName]="i" class="p-4 border border-gray-200 rounded mb-4 bg-gray-50">
            <div class="flex justify-between mb-2">
              <span class="font-semibold text-blue-600">Param #{{i + 1}}</span>
              <button nz-button nzType="text" nzDanger nzSize="small" (click)="removeRequestParam(i)">Xóa</button>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-2">
              <input nz-input formControlName="field" placeholder="Field (VD: start_time)" />
              <input nz-input formControlName="type" placeholder="Type" />
            </div>
            <div formGroupName="logic" class="grid grid-cols-4 gap-2">
              <input nz-input formControlName="base" placeholder="Base" />
              <input nz-input type="number" formControlName="offset_value" placeholder="Offset Value" />
              <input nz-input formControlName="offset_unit" placeholder="Offset Unit" />
              <input nz-input formControlName="format" placeholder="Format" />
            </div>
          </div>
          <button nz-button nzType="dashed" class="w-full" (click)="addRequestParam()">+ Thêm Request Param</button>
        </div>
      </nz-card>
    </div>

    <div *ngIf="currentStep === 2">
      <div formArrayName="transformation_pipeline">
        <div *ngFor="let t of transforms.controls; let i=index" [formGroupName]="i" class="flex gap-4 mb-4 items-start">
          <input nz-input formControlName="action" placeholder="Action (VD: flatten, filter)" class="w-1/4" />
          <textarea nz-input formControlName="params" rows="2" placeholder='Params dạng JSON. VD: {"root_path": "data"}' class="w-full font-mono text-sm"></textarea>
          <button nz-button nzType="default" nzDanger (click)="removeTransform(i)">Xóa</button>
        </div>
        <button nz-button nzType="dashed" class="w-full mt-2" (click)="addTransform()">+ Thêm Pipeline Rule</button>
      </div>
    </div>

    <div *ngIf="currentStep === 3" formGroupName="destination" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <nz-form-item>
          <nz-form-label nzRequired>Type</nz-form-label>
          <nz-form-control><input nz-input formControlName="type" /></nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzRequired>Table Name</nz-form-label>
          <nz-form-control><input nz-input formControlName="table" /></nz-form-control>
        </nz-form-item>
      </div>

      <nz-form-item>
        <nz-form-label nzRequired>Connection URL</nz-form-label>
        <nz-form-control><input nz-input formControlName="url" /></nz-form-control>
      </nz-form-item>

      <div class="grid grid-cols-2 gap-4">
        <nz-form-item>
          <nz-form-label nzRequired>Username</nz-form-label>
          <nz-form-control><input nz-input formControlName="username" /></nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label>Password</nz-form-label>
          <nz-form-control><input nz-input type="password" formControlName="password" /></nz-form-control>
        </nz-form-item>
      </div>

      <nz-card nzTitle="Columns Mapping" nzSize="small">
        <div formArrayName="columns">
          <div *ngFor="let col of destColumns.controls; let i=index" [formGroupName]="i" class="flex gap-4 mb-3 items-center">
            <input nz-input formControlName="mapping" placeholder="Nguồn (VD: station_id)" class="w-1/3" />
            <span class="text-gray-400 font-bold">=></span>
            <input nz-input formControlName="name" placeholder="Đích DB (VD: station_id)" class="w-1/3" />
            <nz-select formControlName="type" class="w-1/4">
               <nz-option nzValue="character varying" nzLabel="character varying"></nz-option>
               <nz-option nzValue="timestamp" nzLabel="timestamp"></nz-option>
               <nz-option nzValue="float" nzLabel="float"></nz-option>
               <nz-option nzValue="integer" nzLabel="integer"></nz-option>
            </nz-select>
            <button nz-button nzType="text" nzDanger (click)="removeColumn(i)">X</button>
          </div>
          <button nz-button nzType="dashed" class="w-full" (click)="addColumn()">+ Thêm Column Mapping</button>
        </div>
      </nz-card>

      <div class="grid grid-cols-2 gap-4">
        <nz-form-item>
          <nz-form-label>Upsert Keys (cách nhau dấu phẩy)</nz-form-label>
          <nz-form-control><input nz-input formControlName="upsert_key" placeholder="VD: station_id, time_point" /></nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label>Update Time Field</nz-form-label>
          <nz-form-control><input nz-input formControlName="update_time_field" /></nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div class="flex justify-between items-center mt-10 pt-5 border-t border-gray-200">
      <button nz-button nzType="default" type="button" [disabled]="currentStep === 0" (click)="prev()">Quay lại</button>
      
      <button nz-button nzType="primary" type="button" *ngIf="currentStep < 3" (click)="next()">Tiếp tục</button>
      <button nz-button nzType="primary" class="bg-green-600 border-green-600 hover:bg-green-500" type="button" *ngIf="currentStep === 3" (click)="onSubmit()">
        Hoàn thành & Sinh JSON
      </button>
    </div>

  </form>
</div>
