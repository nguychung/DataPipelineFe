<div class="max-w-6xl mx-auto p-8 bg-white rounded-xl shadow-sm mt-4">
  <div class="flex justify-between items-center mb-8">
    <h2 class="text-2xl font-bold text-gray-800">Setup Data Sync Flow</h2>
    <!-- <button nz-button nzType="default" routerLink="/flows">Cancel</button> -->
  </div>

  <nz-steps [nzCurrent]="currentStep" class="mb-10">
    <nz-step nzTitle="General Info"></nz-step>
    <nz-step nzTitle="Source Config"></nz-step>
    <nz-step nzTitle="Transformations"></nz-step>
    <nz-step nzTitle="Destination"></nz-step>
  </nz-steps>

  <form nz-form [formGroup]="flowForm" nzLayout="vertical">

    <div *ngIf="currentStep === 0">
      <div formGroupName="flow_metadata" class="grid grid-cols-2 gap-6">
        <nz-form-item class="col-span-2">
          <nz-form-label nzRequired>Flow ID</nz-form-label>
          <nz-form-control><input nz-input formControlName="id"
              placeholder="e.g., station-data-fetcher" /></nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Namespace</nz-form-label>
          <nz-form-control><input nz-input formControlName="namespace" placeholder="company.team" /></nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Description</nz-form-label>
          <nz-form-control><textarea nz-input formControlName="description" rows="1"></textarea></nz-form-control>
        </nz-form-item>
      </div>

      <div formGroupName="trigger" class="mt-6">
        <nz-form-item>
          <nz-form-label nzRequired>Repeat Every (Minutes)</nz-form-label>
          <nz-form-control>
            <nz-input-number formControlName="minutes" [nzMin]="1" class="w-full"></nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div *ngIf="currentStep === 1" formGroupName="source">
      <div *ngIf="isSourceGalleryVisible">
        <label class="font-semibold block mb-4">Select Source Connector:</label>
        <app-connector-gallery (onSelect)="setSourceType($event)"></app-connector-gallery>
      </div>

      <div *ngIf="!isSourceGalleryVisible" class="space-y-6">
        <div class="flex justify-between items-center bg-blue-50 p-3 rounded">
          <span class="text-blue-700 font-bold">Selected: {{flowForm.get('source.type')?.value}}</span>
          <button nz-button nzType="link" (click)="showSourceGallery()">Change Connector</button>
        </div>

        <div class="grid grid-cols-4 gap-4">
          <nz-form-item class="col-span-3">
            <nz-form-label nzRequired>API URL</nz-form-label>
            <nz-form-control><input nz-input formControlName="url" /></nz-form-control>
          </nz-form-item>
          <nz-form-item>
            <nz-form-label nzRequired>Method</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="method">
                <nz-option nzValue="GET" nzLabel="GET"></nz-option>
                <nz-option nzValue="POST" nzLabel="POST"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <nz-card nzTitle="Headers" nzSize="small" class="shadow-sm">
          <div formArrayName="headers">
            <div *ngFor="let h of sourceHeaders.controls; let i=index" [formGroupName]="i" class="flex gap-2 mb-2">
              <input nz-input formControlName="key" placeholder="Key (e.g. Authorization)" />
              <input nz-input formControlName="value" placeholder="Value" />
              <button nz-button nzType="text" nzDanger (click)="removeHeader(i)">X</button>
            </div>
          </div>
          <button nz-button nzType="dashed" class="w-full mt-2" (click)="addHeader()">+ Add Header</button>
        </nz-card>

        <nz-card nzTitle="Request Params Mapping" nzSize="small" class="shadow-sm">
          <div formArrayName="request_param_mapping" class="space-y-4">
            <div *ngFor="let p of requestParams.controls; let i=index" [formGroupName]="i"
              class="p-4 bg-gray-50 rounded border relative">
              <button nz-button nzType="text" nzDanger class="!absolute top-2 right-2"
                (click)="removeRequestParam(i)">X1</button>
              <div class="grid grid-cols-2 gap-4 mb-3">
                <div>
                  <label class="text-xs font-semibold text-gray-500">Field Name</label>
                  <input nz-input formControlName="field" placeholder="e.g. start_time" />
                </div>
                <div>
                  <label class="text-xs font-semibold text-gray-500">Type</label>
                  <input nz-input formControlName="type" placeholder="e.g. datetime_expression" />
                </div>
              </div>
              <div formGroupName="logic" class="grid grid-cols-4 gap-2">
                <input nz-input formControlName="base" placeholder="Base" />
                <nz-input-number formControlName="offset_value" class="w-full"></nz-input-number>
                <input nz-input formControlName="offset_unit" placeholder="Unit (HOURS)" />
                <input nz-input formControlName="format" placeholder="Format" />
              </div>
            </div>
          </div>
          <button nz-button nzType="dashed" class="w-full mt-3" (click)="addRequestParam()">+ Add Param Mapping</button>
        </nz-card>

        <nz-card nzTitle="Request Body Mapping" nzSize="small" class="shadow-sm">
          <div formArrayName="body_mapping" class="space-y-4">
            <div *ngFor="let b of bodyMappings.controls; let i=index" [formGroupName]="i"
              class="p-4 bg-gray-50 rounded border relative">
              <button nz-button nzType="text" nzDanger class="absolute top-2 right-2" (click)="removeBodyMapping(i)">
                <span nz-icon nzType="delete"></span>
              </button>

              <div class="grid grid-cols-2 gap-4 mb-3">
                <div>
                  <label class="text-xs font-semibold text-gray-500 uppercase">Field Name</label>
                  <input nz-input formControlName="field" placeholder="e.g. timestamp" />
                </div>
                <div>
                  <label class="text-xs font-semibold text-gray-500 uppercase">Data Type</label>
                  <input nz-input formControlName="type" placeholder="e.g. datetime_expression" />
                </div>
              </div>

              <div formGroupName="logic">
                <label class="text-xs font-semibold text-gray-500 uppercase block mb-1">Expression Logic</label>
                <div class="grid grid-cols-4 gap-2">
                  <div>
                    <input nz-input formControlName="base" placeholder="Base (now)" />
                  </div>
                  <div>
                    <nz-input-number formControlName="offset_value" class="w-full"
                      nzPlaceHolder="Offset"></nz-input-number>
                  </div>
                  <div>
                    <nz-select formControlName="offset_unit" class="w-full">
                      <nz-option nzValue="SECONDS" nzLabel="Seconds"></nz-option>
                      <nz-option nzValue="MINUTES" nzLabel="Minutes"></nz-option>
                      <nz-option nzValue="HOURS" nzLabel="Hours"></nz-option>
                      <nz-option nzValue="DAYS" nzLabel="Days"></nz-option>
                    </nz-select>
                  </div>
                  <div>
                    <input nz-input formControlName="format" placeholder="Format (yyyy-MM-dd...)" />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <button nz-button nzType="dashed" class="w-full mt-3" (click)="addBodyMapping()">
            <span nz-icon nzType="plus"></span> Add Body Field Mapping
          </button>
        </nz-card>

      </div>
    </div>

    <div *ngIf="currentStep === 2" class="space-y-4">
      <div formArrayName="transformation_pipeline">
        <div *ngFor="let t of transforms.controls; let i=index" [formGroupName]="i"
          class="flex gap-4 p-4 border rounded mb-4">
          <nz-select formControlName="action" class="w-1/4">
            <nz-option nzValue="flatten" nzLabel="Flatten"></nz-option>
            <nz-option nzValue="filter" nzLabel="Filter"></nz-option>
            <nz-option nzValue="calculate" nzLabel="Calculate"></nz-option>
          </nz-select>
          <textarea nz-input formControlName="params" class="flex-1" placeholder="Params (JSON)"></textarea>
          <button nz-button nzDanger (click)="removeTransform(i)">Remove</button>
        </div>
      </div>
      <button nz-button nzType="dashed" class="w-full" (click)="addTransform()">+ Add Step</button>
    </div>

    <div *ngIf="currentStep === 3" formGroupName="destination">
      <div *ngIf="isDestGalleryVisible">
        <label class="font-semibold block mb-4">Select Destination Connector:</label>
        <app-connector-gallery (onSelect)="setDestType($event)"></app-connector-gallery>
      </div>

      <div *ngIf="!isDestGalleryVisible" class="space-y-6">
        <div class="flex justify-between items-center bg-purple-50 p-3 rounded">
          <span class="text-purple-700 font-bold">Target: {{flowForm.get('destination.type')?.value}}</span>
          <button nz-button nzType="link" (click)="showDestGallery()">Change Connector</button>
        </div>

        <nz-form-item><nz-form-label nzRequired>Connection URL</nz-form-label><input nz-input
            formControlName="url" /></nz-form-item>

        <div class="grid grid-cols-3 gap-4">
          <nz-form-item><nz-form-label nzRequired>Username</nz-form-label><input nz-input
              formControlName="username" /></nz-form-item>
          <nz-form-item><nz-form-label>Password</nz-form-label><input nz-input type="password"
              formControlName="password" /></nz-form-item>
          <nz-form-item><nz-form-label nzRequired>Table</nz-form-label><input nz-input
              formControlName="table" /></nz-form-item>
        </div>

        <nz-card nzTitle="Columns Mapping" nzSize="small">
          <div formArrayName="columns">
            <div *ngFor="let col of destColumns.controls; let i=index" [formGroupName]="i" class="flex gap-4 mb-2">
              <input nz-input formControlName="mapping" placeholder="Source Field" />
              <input nz-input formControlName="name" placeholder="DB Column" />
              <nz-select formControlName="type" class="w-1/4">
                <nz-option nzValue="character varying" nzLabel="String"></nz-option>
                <nz-option nzValue="float" nzLabel="Float"></nz-option>
                <nz-option nzValue="timestamp" nzLabel="Timestamp"></nz-option>
              </nz-select>
              <button nz-button nzType="text" nzDanger (click)="removeColumn(i)">X</button>
            </div>
          </div>
          <button nz-button nzType="dashed" class="w-full" (click)="addColumn()">+ Add Column</button>
        </nz-card>
      </div>
    </div>

    <div class="flex justify-between mt-10 border-t pt-6">
      <button nz-button (click)="prev()" [disabled]="currentStep === 0">Back</button>
      <div>
        <button nz-button nzType="primary" (click)="next()" *ngIf="currentStep < 3">Next</button>
        <button nz-button nzType="primary" (click)="onSubmit()" *ngIf="currentStep === 3"
          class="bg-green-600 border-none">Save Flow</button>
      </div>
    </div>
  </form>
</div>
