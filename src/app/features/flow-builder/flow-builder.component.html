<div class="max-w-6xl mx-auto p-8 bg-white rounded-xl shadow-sm mt-4">
  <div class="flex justify-between items-center mb-8">
    <h2 class="text-2xl font-bold text-gray-800">Setup Data Sync Flow</h2>
    <button nz-button nzType="default" routerLink="/flows">Cancel</button>
  </div>

  <nz-steps [nzCurrent]="currentStep" class="mb-10">
    <nz-step nzTitle="General Info"></nz-step>
    <nz-step nzTitle="Source Config"></nz-step>
    <nz-step nzTitle="Transformations"></nz-step>
    <nz-step nzTitle="Destination"></nz-step>
  </nz-steps>

  <form nz-form [formGroup]="flowForm" nzLayout="vertical">
    
    <div *ngIf="currentStep === 0">
      <div formGroupName="flow_metadata" class="grid grid-cols-2 gap-6">
        <nz-form-item class="col-span-2">
          <nz-form-label nzRequired>Flow ID</nz-form-label>
          <nz-form-control><input nz-input formControlName="id" placeholder="e.g., station-data-fetcher" /></nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzRequired>Namespace</nz-form-label>
          <nz-form-control><input nz-input formControlName="namespace" placeholder="company.team" /></nz-form-control>
        </nz-form-item>
        <nz-form-item formGroupName="../trigger">
          <nz-form-label nzRequired>Repeat Every (Minutes)</nz-form-label>
          <nz-input-number formControlName="minutes" [nzMin]="1" class="w-full"></nz-input-number>
        </nz-form-item>
      </div>
      <nz-form-item formGroupName="flow_metadata" class="mt-4">
        <nz-form-label>Description</nz-form-label>
        <textarea nz-input formControlName="description" rows="3"></textarea>
      </nz-form-item>
    </div>

    <div *ngIf="currentStep === 1" formGroupName="source">
      <div *ngIf="isSourceGalleryVisible">
        <label class="font-semibold block mb-4">Select Source Connector:</label>
        <app-connector-gallery (onSelect)="setSourceType($event)"></app-connector-gallery>
      </div>

      <div *ngIf="!isSourceGalleryVisible" class="space-y-6">
        <div class="flex justify-between items-center bg-blue-50 p-3 rounded">
          <span class="text-blue-700 font-bold">Selected: {{flowForm.get('source.type')?.value}}</span>
          <button nz-button nzType="link" (click)="showSourceGallery()">Change Connector</button>
        </div>

        <div class="grid grid-cols-4 gap-4">
          <nz-form-item class="col-span-3"><nz-form-label nzRequired>API URL</nz-form-label><input nz-input formControlName="url" /></nz-form-item>
          <nz-form-item><nz-form-label nzRequired>Method</nz-form-label>
            <nz-select formControlName="method">
              <nz-option nzValue="GET" nzLabel="GET"></nz-option>
              <nz-option nzValue="POST" nzLabel="POST"></nz-option>
            </nz-select>
          </nz-form-item>
        </div>

        <nz-card nzTitle="Headers" nzSize="small">
          <div formArrayName="headers">
            <div *ngFor="let h of sourceHeaders.controls; let i=index" [formGroupName]="i" class="flex gap-2 mb-2">
              <input nz-input formControlName="key" placeholder="Key" />
              <input nz-input formControlName="value" placeholder="Value" />
              <button nz-button nzType="text" nzDanger (click)="removeHeader(i)">X</button>
            </div>
          </div>
          <button nz-button nzType="dashed" class="w-full" (click)="addHeader()">+ Add Header</button>
        </nz-card>
      </div>
    </div>

    <div *ngIf="currentStep === 2" class="space-y-4">
      <div formArrayName="transformation_pipeline">
        <div *ngFor="let t of transforms.controls; let i=index" [formGroupName]="i" class="flex gap-4 p-4 border rounded mb-4">
          <nz-select formControlName="action" class="w-1/4">
            <nz-option nzValue="flatten" nzLabel="Flatten"></nz-option>
            <nz-option nzValue="filter" nzLabel="Filter"></nz-option>
            <nz-option nzValue="calculate" nzLabel="Calculate"></nz-option>
          </nz-select>
          <textarea nz-input formControlName="params" class="flex-1" placeholder="Params (JSON)"></textarea>
          <button nz-button nzDanger (click)="removeTransform(i)">Remove</button>
        </div>
      </div>
      <button nz-button nzType="dashed" class="w-full" (click)="addTransform()">+ Add Step</button>
    </div>

    <div *ngIf="currentStep === 3" formGroupName="destination">
      <div *ngIf="isDestGalleryVisible">
        <label class="font-semibold block mb-4">Select Destination Connector:</label>
        <app-connector-gallery (onSelect)="setDestType($event)"></app-connector-gallery>
      </div>

      <div *ngIf="!isDestGalleryVisible" class="space-y-6">
        <div class="flex justify-between items-center bg-purple-50 p-3 rounded">
          <span class="text-purple-700 font-bold">Target: {{flowForm.get('destination.type')?.value}}</span>
          <button nz-button nzType="link" (click)="showDestGallery()">Change Connector</button>
        </div>

        <nz-form-item><nz-form-label nzRequired>Connection URL</nz-form-label><input nz-input formControlName="url" /></nz-form-item>
        
        <div class="grid grid-cols-3 gap-4">
          <nz-form-item><nz-form-label nzRequired>Username</nz-form-label><input nz-input formControlName="username" /></nz-form-item>
          <nz-form-item><nz-form-label>Password</nz-form-label><input nz-input type="password" formControlName="password" /></nz-form-item>
          <nz-form-item><nz-form-label nzRequired>Table</nz-form-label><input nz-input formControlName="table" /></nz-form-item>
        </div>

        <nz-card nzTitle="Columns Mapping" nzSize="small">
          <div formArrayName="columns">
            <div *ngFor="let col of destColumns.controls; let i=index" [formGroupName]="i" class="flex gap-4 mb-2">
              <input nz-input formControlName="mapping" placeholder="Source Field" />
              <input nz-input formControlName="name" placeholder="DB Column" />
              <nz-select formControlName="type" class="w-1/4">
                <nz-option nzValue="character varying" nzLabel="String"></nz-option>
                <nz-option nzValue="float" nzLabel="Float"></nz-option>
              </nz-select>
              <button nz-button nzType="text" nzDanger (click)="removeColumn(i)">X</button>
            </div>
          </div>
          <button nz-button nzType="dashed" class="w-full" (click)="addColumn()">+ Add Column</button>
        </nz-card>
      </div>
    </div>

    <div class="flex justify-between mt-10 border-t pt-6">
      <button nz-button (click)="prev()" [disabled]="currentStep === 0">Back</button>
      <div>
        <button nz-button nzType="primary" (click)="next()" *ngIf="currentStep < 3">Next</button>
        <button nz-button nzType="primary" (click)="onSubmit()" *ngIf="currentStep === 3" class="bg-green-600 border-none">Save Flow</button>
      </div>
    </div>
  </form>
</div>
